services:
  nas-tools:
    image: hsuyelin/nas-tools:latest
    container_name: nas-tools
    hostname: nas-tools
    restart: always
    network_mode: host
    environment:
      - PUID=1000                          # 建议不要用 root (0)，改为你宿主机用户的 UID
      - PGID=1000                          # 对应 GID（可通过 `id` 命令查看）
      - UMASK=022                          # 更安全的默认权限掩码
      - NASTOOL_AUTO_UPDATE=false
      - NASTOOL_CN_UPDATE=false
    ports:
      - "3000:3000"  # Web UI 端口
    volumes:
      - ./config:/config                  # 配置目录（请确保当前目录可写）
      - ./media:/media                    # 示例：媒体主目录（请替换为实际路径）

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - WEBUI_PORT=2232
      - PUID=0
      - PGID=0
    volumes:
      - ./qbittorrent/config:/config
      - ./qbittorrent/downloads:/downloads
    restart: unless-stopped

  embyserver:
    image: amilys/embyserver:latest
    container_name: emby
    network_mode: host  # 推荐使用 host 模式
    environment:
      - TZ=Asia/Shanghai
      - UID=0
      - GID=0
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - ./emby:/data    # 数据目录
      - ./emby:/config  # 配置目录
      - ./media:/media  # 电影目录
    restart: unless-stopped

  jellyfin:
    image: nyanmisaka/jellyfin:latest
    container_name: jellyfin
    network_mode: bridge
    environment:
      - TZ=Asia/Shanghai
      - PUID=0
      - PGID=0
      - JELLYFIN_CACHE_DIR=/cache      # 缓存目录
      - JELLYFIN_MEDIA_DIR=/media      # 媒体目录
    #devices:
    #  - /dev/dri:/dev/dri              # 硬件加速 (可选)
    ports:
      - "2233:8096"
      - "2234:8920"
    volumes:
      - ./jellyfin:/config            # 配置文件存储
      - ./jellyfin:/cache             # 缓存目录（替换为实际路径）
      - ./media:/media                # 媒体库目录（映射到容器的 /media）
    restart: unless-stopped