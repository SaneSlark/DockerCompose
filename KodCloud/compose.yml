services:
  redis:
    image: redis:alpine
    container_name: kodcloud-redis
    restart: always

  db:
    image: mariadb:lts
    container_name: kodcloud-db
    command: --transaction-isolation=READ-COMMITTED
    restart: always
    volumes:
      - "./db:/var/lib/mysql"       #./db是数据库持久化目录
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=kodbox
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_CHARSET=utf8mb4
      - MARIADB_COLLATION=utf8mb4_unicode_ci
    env_file:
      - db.env
      
  app:
    image: kodcloud/kodbox:latest
    container_name: kodcloud-app
    restart: always
    ports:
      - "2255:80"
    volumes:
      - "./site:/var/www/html"      #./site是站点目录位置
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_HOST=db
      - REDIS_HOST=redis
    env_file:
      - db.env
    depends_on:
      - db
      - redis
