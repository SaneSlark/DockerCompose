services:
  v2ray:
    image: v2fly/v2fly-core:latest
    container_name: v2ray
    network_mode: bridge
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
    environment:
      - DOMAIN=example.com  # 修改为您自己的域名
      - UUID=your-custom-uuid-here  # 添加这行来自定义UUID
    ports:
      - "2275:2275"
      - "2276:2276"
      - "2277:2277"
      - "2278:2278/udp"
      - "2278:2278/tcp"
      - "2279:2279"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["v2ray", "run", "-c", "/etc/v2ray/config.json"]
    restart: always
