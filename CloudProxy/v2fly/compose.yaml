services:
  v2ray:
    image: v2fly/v2fly-core:latest
    container_name: v2ray
    network_mode: bridge
    # 挂载配置
    volumes:
      - ./config.json:/etc/v2ray/config.json
    environment:
      - DOMAIN=example.com  # 修改为您自己的域名
      - UUID=b131d7a5-4fea-b1a1-a3c4-e66924b06ed2  # 添加这行来自定义UUID
      # 端口定义
      - PORT_BASE=2275      # VMess-WS
      - PORT_BASE_2=2276    # VLESS-WS
      - PORT_BASE_3=2277    # VLESS-H2
      - PORT_BASE_4=2278    # VLESS-QUIC (需要 TCP 和 UDP)
      - PORT_BASE_5=2279    # Trojan-WS
      # 核心：使用官方镜像的 ENV 替换功能
      - COMMAND_FLAG_CONFIG_FILE=/etc/v2ray/config.json
    ports:
      - 2275:2275      # VMess-WS (TCP)
      - 2276:2276      # VLESS-WS (TCP)
      - 2277:2277      # VLESS-H2 (TCP)
      - 2278:2278/tcp  # VLESS-QUIC (TCP)
      - 2278:2278/udp  # VLESS-QUIC (UDP 必须)
      - 2279:2279      # Trojan-WS (TCP)
    command: ["v2ray", "run", "-c", "/etc/v2ray/config.json"]
    entrypoint: ["/bin/sh", "/script.sh"]
    restart: always
