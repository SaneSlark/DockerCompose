services:
  moviepilot:
    image: jxxghp/moviepilot-v2:latest
    container_name: moviepilot
    hostname: moviepilot-v2
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - TZ=Asia/Shanghai
      - NGINX_PORT=2230
      - PORT=2231
      - PUID=0
      - PGID=0
      - UMASK=000
      - SUPERUSER=admin
    volumes:
      - ./:/media
      - ./config:/config
      - ./core:/moviepilot/.cache/ms-playwright
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - WEBUI_PORT=2232
      - PUID=0
      - PGID=0
    volumes:
      - ./qbittorrent/config:/config
      - ./qbittorrent/downloads:/downloads
    restart: unless-stopped

  embyserver:
    image: amilys/embyserver:latest
    container_name: emby
    network_mode: host  # 推荐使用 host 模式
    environment:
      - TZ=Asia/Shanghai
      - UID=0
      - GID=0
    ports:
      - 8096:8096
      - 8920:8920
    volumes:
      - ./emby:/data    # 数据目录
      - ./emby:/config  # 配置目录
      - ./media:/media  # 电影目录
    restart: unless-stopped

  jellyfin:
    image: nyanmisaka/jellyfin:latest
    container_name: jellyfin
    network_mode: bridge
    environment:
      - TZ=Asia/Shanghai
      - PUID=0
      - PGID=0
      - JELLYFIN_CACHE_DIR=/cache      # 缓存目录
      - JELLYFIN_MEDIA_DIR=/media      # 媒体目录
    #devices:
    #  - /dev/dri:/dev/dri              # 硬件加速 (可选)
    ports:
      - 2233:8096
      - 2234:8920
    volumes:
      - ./jellyfin:/config            # 配置文件存储
      - ./jellyfin:/cache             # 缓存目录（替换为实际路径）
      - ./media:/media                # 媒体库目录（映射到容器的 /media）
    restart: unless-stopped
